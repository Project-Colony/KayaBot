name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every GitHub-hosted runner image: no third-party action to
      # pin, and nothing for Dependabot to lose track of. bash keeps the same
      # step working on the Windows leg.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Formatting
        run: cargo fmt --all --check

      # Per OS: main.rs has unix and windows branches.
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

  # rust-version in Cargo.toml is a promise about who can build KayaBot.
  # Without this job nothing ever builds on it, and it drifts.
  #
  # RUSTUP_TOOLCHAIN is what pins the cargo invocations: it outranks both the
  # runner's rustup default and any rust-toolchain.toml. The rustc check makes
  # a pin that silently stopped working fail loudly.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"

      - name: Install Rust ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: |
          rustc --version | grep -q "^rustc ${RUSTUP_TOOLCHAIN}[. ]" \
            || { echo "::error::expected rustc ${RUSTUP_TOOLCHAIN}, got $(rustc --version)"; exit 1; }
          cargo check --locked --all-targets

  i18n:
    name: translations up to date
    runs-on: ubuntu-latest
    steps:
      # No `fetch-depth` needed, and that is the point: the check compares the
      # BLOB HASH of each English source against the stamp its translations
      # carry, which is computable from the working tree alone. The obvious
      # alternative, `git log` on the source, reports a single commit on the
      # depth-1 clone Actions makes by default, so every comparison would come
      # out equal and this job would pass green forever while translations rot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check every translation against its English source
        run: ./scripts/i18n-check.sh

      - name: Check every link and anchor resolves
        run: ./scripts/i18n-links.py
