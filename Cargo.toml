[package]
name = "kayabot"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Desktop media renamer that matches movies and TV episodes against online metadata sources"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/KayaBot"

[dependencies]
dirs = "7.0.0"
eframe = "0.27.2"
open = "5.4.4"
rfd = "0.17.2"
reqwest = { version = "0.13.5", features = ["blocking", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.8"

[dev-dependencies]
insta = "1.49.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
