[package]
name = "kayabot"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "5.0"
eframe = "0.27"
open = "5.1"
rfd = "0.14"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
insta = "1.38.0"
